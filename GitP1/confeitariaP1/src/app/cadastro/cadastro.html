<div class="janela-cadastro">
  <div class="painel-imagem">
    <img src="/login.jpg" alt="Confeitaria da Web" />
  </div>

  <div class="painel-form">
    <img src="/logo.png" class="logo">

    <h3>Faça seu Cadastro</h3>

    <form class="needs-validation" id="formCadastro" novalidate
          (ngSubmit)="onSubmit(formCadastroRef)" #formCadastroRef>

      <label class="form-label" for="txtNome">Nome:</label>
      <div class="input-icon-box">
        <i class="bi bi-nome input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round preview-icon">
            <path d="M17.925 20.056a6 6 0 0 0-11.851.001"/>
            <circle cx="12" cy="11" r="4"/>
            <circle cx="12" cy="12" r="10"/>
          </svg>
        </i>
        <input type="text" id="txtNome" class="form-control com-icone" required>
      </div>
      <div class="invalid-feedback">Nome é obrigatório!</div>

      <label class="form-label" for="txtEmail">E-mail:</label>
      <div class="input-icon-box">
        <i class="bi bi-envelope input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail preview-icon">
            <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/>
            <rect x="2" y="4" width="20" height="16" rx="2"/>
          </svg>
        </i>
        <input type="email" id="txtEmail" class="form-control com-icone" required>
      </div>
      <div class="invalid-feedback">email é obrigatório!</div>

      <label class="form-label" for="txtSenha">Senha:</label>
      <div class="input-icon-box">
        <i class="bi bi-lock input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock preview-icon">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </i>
        <input type="password" id="txtSenha" class="form-control com-icone" required
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$">
      </div>
      <div class="invalid-feedback">A senha deve conter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma letra minúscula, um número e um caractere especial (@$!%*?&).</div>

      <label class="form-label" for="txtTelefone">Telefone:</label>
      <div class="input-icon-box">
        <i class="bi bi-telefone input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone preview-icon">
                <path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>
            </svg>
        </i>
        <input type="text" id="txtTelefone" class="form-control" required
            pattern="[0-9]{4,5}-[0-9]{4}">
      </div>
      <div class="invalid-feedback">Informe um telefone válido!</div>

      <button type="submit" class="btn btn-success w-100">Criar</button>

      <p class="ja-tenho-conta">
        <a href="login">Já tenho uma conta</a>
      </p>
    </form>
  </div>
</div>
