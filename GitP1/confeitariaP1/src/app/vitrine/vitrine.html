<div class="container my-4">
  
  <div class="alert alert-success alert-dismissible fade show d-flex justify-content-between align-items-center" role="alert" *ngIf="mostrarAviso">
    <span>Produto adicionado à cesta com sucesso!</span>
    <div class="d-flex align-items-center">
      <a routerLink="/cesta" class="btn btn-sm btn-outline-success me-2">Ir à cesta</a>
      <button type="button" class="btn-close" aria-label="Fechar" (click)="mostrarAviso = false"></button>
    </div>
  </div>

  <div class="row justify-content-end mb-4">
    
    <div class="col-md-6 text-start">
      <h2 class="catalogo-titulo">Catálogo</h2>
    </div>

    <div class="col-md-6 d-flex justify-content-end mt-3 mt-md-0">
      <div class="search-box">
        <i class="bi bi-search search-icon"></i>
        <input 
          type="text" 
          class="search-input"
          placeholder="Pesquisar doce..." 
          [(ngModel)]="termoPesquisa"
        >
        <button 
          class="search-clear-btn" 
          type="button" 
          *ngIf="termoPesquisa" 
          (click)="termoPesquisa = ''"
        >
          ✕
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-3 mb-4" *ngFor="let obj of produtosFiltrados">
      <a [routerLink]="['/detalhe', obj.codigo]" class="card-link">
        <div class="card h-100">

          <img [src]="obj.codigo + '.jpg'" class="card-img-top" [alt]="obj.nome">
          
          <div class="card-body d-flex flex-column justify-content-between">

            <h5 class="card-title">{{ obj.nome }}</h5>
            

            <div class="my-2">

              <ng-container *ngIf="obj.valorPromo">
                <span class="text-decoration-line-through me-2">R$ {{ obj.valor }}</span>
                <span class="text-success">R$ {{ obj.valorPromo }}</span>
              </ng-container>


              <ng-container *ngIf="!obj.valorPromo">
                <span>R$ {{ obj.valor }}</span>
              </ng-container>
            </div>


            <div class="btn-buy">
              <span class="btn-buy-btn">Comprar</span>
            </div>
          </div>
        </div>
      </a>
    </div>

    <div class="col-12 text-center my-5" *ngIf="produtosFiltrados.length === 0">
      <p class="text-muted fs-5">Nenhum produto encontrado para "{{ termoPesquisa }}".</p>
    </div>
  </div>
</div>
