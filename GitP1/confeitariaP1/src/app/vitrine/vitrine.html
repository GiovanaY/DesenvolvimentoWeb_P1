<div class="container my-4">
  <!-- Campo de Pesquisa -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-6">
      <div class="search-box">
        <i class="bi bi-search search-icon"></i>
        <input 
          type="text" 
          class="search-input"
          placeholder="Pesquisar doce..." 
          [(ngModel)]="termoPesquisa"
        >
        <button 
          class="search-clear-btn" 
          type="button" 
          *ngIf="termoPesquisa" 
          (click)="termoPesquisa = ''"
        >
          ✕
        </button>
      </div>
    </div>
  </div>

  <!-- Grid de Produtos -->
  <div class="row">
    <div class="col-md-3 mb-4" *ngFor="let obj of produtosFiltrados">
      <div class="card h-100">
        <!-- Imagem do Produto -->
        <img [src]="obj.codigo + '.jpg'" class="card-img-top" [alt]="obj.nome">
        
        <div class="card-body d-flex flex-column justify-content-between">
          <!-- Título -->
          <h5 class="card-title">{{ obj.nome }}</h5>
          
          <!-- Bloco de Preço -->
          <div class="my-2">
            <!-- Com Desconto -->
            <ng-container *ngIf="obj.valorPromo">
              <span class="text-decoration-line-through me-2">R$ {{ obj.valor }}</span>
              <span class="text-success">R$ {{ obj.valorPromo }}</span>
            </ng-container>

            <!-- Preço Normal -->
            <ng-container *ngIf="!obj.valorPromo">
              <span>R$ {{ obj.valor }}</span>
            </ng-container>
          </div>

          <!-- Botão Comprar com as suas classes CSS -->
          <div class="btn-buy">
            <button class="btn-buy-btn" type="button">Comprar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mensagem de Nenhum Resultado Encontrado -->
    <div class="col-12 text-center my-5" *ngIf="produtosFiltrados.length === 0">
      <p class="text-muted fs-5">Nenhum produto encontrado para "{{ termoPesquisa }}".</p>
    </div>
  </div>
</div>
